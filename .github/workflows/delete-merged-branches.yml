name: Delete merged branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: delete-merged-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete-merged-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          encoded_ref="$(
            python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))'
          )"

          if gh api "repos/${REPOSITORY}/git/ref/heads/${encoded_ref}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${encoded_ref}"
            printf 'Deleted merged branch %s\n' "${HEAD_REF}"
          else
            printf 'Merged branch %s is already absent\n' "${HEAD_REF}"
          fi
